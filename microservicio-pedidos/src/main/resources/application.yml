server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: microservicio-pedidos

# ======================== PERSISTENCIA ========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # ======================== SEGURIDAD OAUTH2 ========================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/092500a8-a2b9-4d48-8ac2-1241d08e37c1/v2.0}

  # ======================== RABBITMQ ========================
  rabbitmq:
    addresses: localhost:5672,localhost:5673
    username: admin
    password: ${RABBIT_PASSWORD}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
          max-attempts: 3
    publisher-confirm-type: correlated
    publisher-returns: true

  # ======================== KAFKA ========================
  kafka:
    # Con 2 brokers; si uno cae el cliente sigue conectado al otro
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        request.timeout.ms: 15000
        delivery.timeout.ms: 60000
        linger.ms: 5
        max.block.ms: 3000
        # El consumidor tipa por default.type, no por headers de clase Java
        spring.json.add.type.headers: false
    consumer:
      group-id: pedidos-metricas-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: cl.pedidos360.microservicio_pedidos.dto.MetricaClienteDto
        spring.json.trusted.packages: cl.pedidos360.microservicio_pedidos.dto
        spring.json.use.type.headers: false
        max.poll.records: 100
        session.timeout.ms: 30000
    listener:
      ack-mode: record
      concurrency: 3

  # ======================== JACKSON ========================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ======================== AZURE / CORS ========================
azure:
  tenant-id: ${AZURE_TENANT_ID:092500a8-a2b9-4d48-8ac2-1241d08e37c1}
  audience: ${AZURE_AUDIENCE:api://pedidos360-backend}
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "https://*.amazonaws.com"
      - "https://*.azurewebsites.net"

# ======================== ACTUATOR ========================
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# ======================== LOGGING ========================
logging:
  level:
    root: INFO
    cl.pedidos360: DEBUG
    org.springframework.security: INFO
    org.springframework.amqp: INFO