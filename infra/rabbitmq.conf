# ==============================================================================
# RabbitMQ Cluster Configuration - Pedidos360 (Cloud Native DSY1107)
# Optimizado para instancias Cloud EC2 de bajos recursos (t2.micro / t3.micro / t3.small)
# ==============================================================================

# 1. Configuración de Clustering Automático (Classic Config)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Intervalo de limpieza y verificación de nodos del clúster (ms)
cluster_formation.node_cleanup.interval = 10000

# Estrategia de recuperación ante particiones de red (Autoheal para resiliencia en Cloud)
cluster_partition_handling = autoheal

# 2. Control Estricto de Memoria (Evita OOM Killer en EC2)
# Limita la memoria máxima de la máquina virtual Erlang a 256MB por nodo
vm_memory_high_watermark.absolute = 256MB
vm_memory_high_watermark_paging_ratio = 0.5

# Límite mínimo de espacio libre en disco para alertar (50MB)
disk_free_limit.absolute = 50MB

# 3. Optimización de Red y Conexiones
heartbeat = 60
frame_max = 131072
channel_max = 500
