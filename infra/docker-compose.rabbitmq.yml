# ==============================================================================
# Clúster RabbitMQ de 2 nodos - Pedidos360
# Uso:  docker compose -f docker-compose.rabbitmq.yml up -d
# Requiere un archivo .env junto a este compose (ver .env.example)
# ==============================================================================

services:
  rabbitmq-1:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en el archivo .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBIT_ERLANG_COOKIE:?Define RABBIT_ERLANG_COOKIE en el archivo .env}
      # Limitar hilos schedulers de Erlang a 1 para no agotar créditos de CPU en t2/t3
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +P 524288"
    ports:
      - "5672:5672"     # AMQP (Nodo 1)
      - "15672:15672"   # Management Web (Nodo 1)
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster
    mem_limit: 384m
    mem_reservation: 192m
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  rabbitmq-2:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en el archivo .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBIT_ERLANG_COOKIE:?Define RABBIT_ERLANG_COOKIE en el archivo .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +P 524288"
    ports:
      - "5673:5672"     # AMQP (Nodo 2)
      - "15673:15672"   # Management Web (Nodo 2)
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster
    mem_limit: 384m
    mem_reservation: 192m
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 35s

volumes:
  rabbitmq_data_1:
    name: rabbitmq_data_1
  rabbitmq_data_2:
    name: rabbitmq_data_2

networks:
  rabbitmq_cluster:
    name: rabbitmq_cluster
    driver: bridge
